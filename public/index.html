<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Festival Food Calendar</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  transition: 0.3s;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  padding: 8px 14px;
  border: none;
  background: linear-gradient(135deg, #333, #555);
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: linear-gradient(135deg, #ff7a18, #ffb347);
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.day {
  background: white;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  text-align: center;
  transition: 0.2s;
}

.day:hover {
  transform: scale(1.05);
  background: #e6f7ff;
}

.marker {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.modal-content {
  background: white;
  width: 350px;
  margin: 10% auto;
  padding: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Festival Food Calendar</h1>

  <div class="header">
    <button onclick="prevMonth()">⬅ Prev</button>
    <h3 id="monthTitle"></h3>
    <button onclick="nextMonth()">Next ➡</button>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="festivalName"></h2>
    <p id="festivalRegion"></p>
    <div id="foodList"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const festivals = [
  // January
  {
    date: "2026-01-14",
    name: "Pongal",
    region: "Tamil Nadu",
    foods: [
      { name: "Sakkarai Pongal", desc: "Sweet rice dish" },
      { name: "Ven Pongal", desc: "Savory rice dish" }
    ]
  },

  // February
  {
    date: "2026-02-19",
    name: "Maha Shivratri",
    region: "Pan India",
    foods: [
      { name: "Fruits & Milk", desc: "Light fasting foods" }
    ]
  },

  // March
  {
    date: "2026-03-25",
    name: "Holi",
    region: "North India",
    foods: [
      { name: "Gujiya", desc: "Sweet dumpling filled with khoya" },
      { name: "Thandai", desc: "Cold festive drink" }
    ]
  },

  // April
  {
    date: "2026-04-14",
    name: "Vishu",
    region: "Kerala",
    foods: [
      { name: "Sadya", desc: "Traditional vegetarian feast" }
    ]
  },

  // May
  {
    date: "2026-05-23",
    name: "Buddha Purnima",
    region: "Pan India",
    foods: [
      { name: "Kheer", desc: "Sweet rice pudding" }
    ]
  },

  // June
  {
    date: "2026-06-21",
    name: "Rath Yatra",
    region: "Odisha",
    foods: [
      { name: "Poda Pitha", desc: "Traditional baked cake" }
    ]
  },

  // July
  {
    date: "2026-07-21",
    name: "Eid al-Adha",
    region: "Pan India",
    foods: [
      { name: "Biryani", desc: "Spiced rice with meat" }
    ]
  },

  // August
  {
    date: "2026-08-15",
    name: "Independence Day",
    region: "India",
    foods: [
      { name: "Ladoo", desc: "Popular Indian sweet" }
    ]
  },

  // September
  {
    date: "2026-09-17",
    name: "Ganesh Chaturthi",
    region: "Maharashtra",
    foods: [
      { name: "Modak", desc: "Sweet dumplings offered to Lord Ganesha" }
    ]
  },

  // October
  {
    date: "2026-10-20",
    name: "Dussehra",
    region: "Pan India",
    foods: [
      { name: "Jalebi", desc: "Sweet deep-fried dessert" }
    ]
  },

  // November
  {
    date: "2026-11-12",
    name: "Diwali",
    region: "Pan India",
    foods: [
      { name: "Kaju Katli", desc: "Cashew-based sweet" },
      { name: "Ladoo", desc: "Round sweet balls" }
    ]
  },

  // December
  {
    date: "2026-12-25",
    name: "Christmas",
    region: "Pan India",
    foods: [
      { name: "Plum Cake", desc: "Rich fruit cake" },
      { name: "Cookies", desc: "Baked festive treats" }
    ]
  }
];

let currentDate = new Date();

const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");

function renderCalendar() {
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  // Month name
  const monthNames = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];
  monthTitle.innerText = `${monthNames[month]} ${year}`;

  // First day & days in month
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    calendar.appendChild(empty);
  }

  // Create days
  for (let day = 1; day <= daysInMonth; day++) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.innerText = day;

    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const fest = festivals.find(f => f.date === dateStr);

    if (fest) {
      const marker = document.createElement("div");
      marker.className = "marker";
      marker.style.background = "red";
      dayDiv.appendChild(marker);

      dayDiv.onclick = () => openModal(fest);
    }

    calendar.appendChild(dayDiv);
  }
}

function prevMonth() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
}

function openModal(festival) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("festivalName").innerText = festival.name;
  document.getElementById("festivalRegion").innerText = festival.region;

  const foodList = document.getElementById("foodList");
  foodList.innerHTML = "";

  festival.foods.forEach(food => {
    const div = document.createElement("div");
    div.innerHTML = `<strong>${food.name}</strong><br>${food.desc}`;
    foodList.appendChild(div);
  });
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

renderCalendar();
</script>

</body>
</html>
